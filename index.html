<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imposter</title>
    <script src="script.js" defer type="module"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="title-imposter">IMPOSTER</h1>
    <input type="number" name="text" class="input" placeholder="Amount of Players" id="number-input"/> 
    <button id="start-button">
        <span class="play">play</span>
    </button>
    <div id="input-fields" class="textInputWrapper"></div>
    <button class="submit-button" id="submit-button">
    SUBMIT!
        <svg fill="currentColor" viewBox="0 0 24 24" class="icon">
            <path
            clip-rule="evenodd"
            d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z"
            fill-rule="evenodd"
            ></path>
        </svg>
    </button>

        <button id="show-hide-button">SHOW</button>
         <h1 id="info"></h1>
         <h2 id="player-now"></h2>
         <button id="next-player-button">.</button>
        
         <button id="reveal">Reveal The Imposter!</button>
        
</body>
</html>
